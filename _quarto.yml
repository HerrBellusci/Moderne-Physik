project:
  type: book
  render:
    - index.qmd
    - "*_umbau.qmd"
    - references.qmd
  post-render: tools/strip-polyfill.py
  resources:
    - assets/**
    - "!assets/animations/zukuenftig/**"
    - "Videos einbinden/**"
    - licenses/**
    - THIRD-PARTY-NOTICES.md
    - LICENSE.md

book:
  title: "Interaktives Quarto-Workbook Moderne Physik"
  author: "Physik Belluni"
  date: today
  chapters:
    - index.qmd
    - 01_srt_raum_und_zeit_umbau.qmd
    - 02_srt_impuls_und_energie_umbau.qmd
    - 03_laser_ausflug_umbau.qmd
    - references.qmd
  page-footer:
    center:
      - text: "Legacy-Arbeitsblätter"
        href: legacy-arbeitsblaetter.qmd

lang: de
filters:
  - tools/learning-goal-icons.lua
  - multibib
citeproc: false
multibib:
  grundlagen: references-grundlagen.bib
  weiterfuehrend: references-weiterfuehrend.bib

crossref:
  chapters: true
  fig-title: Veranschaulichung
  fig-prefix: Veranschaulichung

format:
  html:
    theme: [cosmo, assets/styles/no-webfont.scss]
    crossrefs-hover: false
    html-math-method:
      method: mathjax
      url: assets/mathjax/tex-svg-full.js
    css:
      - assets/styles/learning-boxes.css
      - assets/fonts/source-sans-pro.css
    include-after-body: assets/includes/toc-in-sidebar.html
    toc: true
    toc-location: left
    toc-depth: 3
    number-sections: false
